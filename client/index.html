    <!-- Theme & Language flash prevention script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('jaanch_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || (savedTheme !== 'light' && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var savedLang = localStorage.getItem('jaanch_language');
          if (savedLang) {
            document.documentElement.lang = savedLang;
          }
        } catch (e) {
          // localStorage disabled or security exception
        }
      })();
    </script>

    <!-- Structured Data (JSON-LD): FAQPage Schema for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is an internship scam detector and how does Jaanch work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An internship scam detector is a specialized digital security tool that evaluates job and internship offers for signs of employment fraud. Jaanch runs a deterministic 15-rule heuristic engine that tests for advance-fee traps (laptop security deposits, gate pass fees), lookalike typosquatted company domains, banking OTP phishing, and coercive 24-hour deadlines. It extracts documents locally in your browser and redacts sensitive personal data before performing verification."
          }
        },
        {
          "@type": "Question",
          "name": "Can a legitimate company ask for a security deposit or training fee for an internship in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Under Indian employment guidelines and AICTE internship norms, legitimate companies and recruiters NEVER ask students or job candidates to pay upfront fees, refundable laptop security deposits, registration charges, or gate pass fees. Demands for advance fees are the number one indicator of employment fraud."
          }
        },
        {
          "@type": "Question",
          "name": "How can I verify an internship offer online in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To verify an internship offer online: 1) Paste the offer text or upload the offer letter into the Jaanch Internship Scam Detector. 2) Verify the employer company's registration on the Ministry of Corporate Affairs (MCA21) portal. 3) Confirm that the recruiter email is from an official corporate domain rather than free Gmail, Yahoo, or Telegram channels. 4) Cross-check vacancy listings on official platforms like the AICTE Internship Portal or National Career Service (NCS)."
          }
        },
        {
          "@type": "Question",
          "name": "What are the common warning signs of fake internship offers and job scams?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The most common warning signs include: 1) Requests for upfront fees (laptop security, gate passes, training kits, or background check fees). 2) Communication exclusively via WhatsApp, Telegram, or free webmail (@gmail.com). 3) Immediate selection without an interview or portfolio review. 4) Unrealistic stipends or salaries for entry-level positions. 5) Coercive urgency demanding immediate payment within hours to reserve a seat."
          }
        },
        {
          "@type": "Question",
          "name": "How do I check if an internship website or recruiter domain is fake?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the Jaanch Fake Internship Website Checker (/link-check) to analyze the recruiter's web domain. Check WHOIS records for recent domain registration (scam domains are typically days or weeks old), look for typosquatting (e.g. micros0ft.com or tcs-careers.net), and verify SSL certificates against recognized corporate organizations."
          }
        },
        {
          "@type": "Question",
          "name": "Where should I report an online internship or job scam in India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Immediately dial the National Cyber Crime Helpline number 1930 or file an official cyber fraud complaint at cybercrime.gov.in. If funds were transferred via UPI, notify your bank and the cyber police immediately within the critical Golden Hour to freeze the recipient account."
          }
        }
      ]
    }
